[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intent.py"
version = "0.1.0"
description = "Python bot SDK for Intent"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "IntentAi"}]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "msgpack>=1.0.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/IntentAi/intent.py"
Repository = "https://github.com/IntentAi/intent.py"

[tool.setuptools.packages.find]
include = ["intent*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "N818"]  # N818: Allow HTTPException naming for discord.py compat

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
