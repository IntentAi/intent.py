name: CI

on:
  pull_request:
    paths:
      - "intent/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check intent/ tests/

      - name: Typecheck
        run: mypy intent/ --strict

      - name: Test
        run: pytest tests/ -v
